<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca — Voomp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F5F5;display:flex;height:100vh;overflow:hidden;font-size:13px;color:#262626;}

/* ── Sidebar icons ── */
.sidebar{width:52px;background:#fff;border-right:1px solid #EBEBEB;display:flex;flex-direction:column;align-items:center;flex-shrink:0;z-index:10;}
.s-logo{padding:14px 0 12px;border-bottom:1px solid #EBEBEB;width:100%;display:flex;justify-content:center;}
.s-logo svg{width:26px;height:26px;}
.s-nav{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;flex:1;}
.s-btn{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:none;color:#9E9E9E;transition:all .15s;position:relative;}
.s-btn:hover{background:#FFF3EC;color:#FE6100;}
.s-btn.active{background:#FFF3EC;color:#FE6100;}
.s-btn svg{width:17px;height:17px;}
.s-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#FE6100;}

/* ── Left search panel ── */
.search-panel{width:220px;background:#fff;border-right:1px solid #EBEBEB;display:flex;flex-direction:column;flex-shrink:0;}
.sp-header{padding:14px 16px 10px;border-bottom:1px solid #F5F5F5;}
.sp-title{font-size:14px;font-weight:600;color:#262626;margin-bottom:12px;}

/* Entity dropdown */
.sp-select{width:100%;height:32px;border:1px solid #E0E0E0;border-radius:6px;padding:0 10px;font-size:12px;color:#262626;background:#fff;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239E9E9E' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;margin-bottom:6px;}
.sp-select:focus{border-color:#FE6100;}

/* Sub-filter dropdown */
.sp-subfilter{width:100%;height:32px;border:1px solid #E0E0E0;border-radius:6px;padding:0 10px;font-size:12px;color:#262626;background:#fff;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%239E9E9E' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;margin-bottom:6px;}
.sp-subfilter:focus{border-color:#FE6100;}

/* Search input */
.sp-input-wrap{position:relative;margin-bottom:10px;}
.sp-input{width:100%;height:34px;border:1px solid #E0E0E0;border-radius:6px;padding:0 30px 0 10px;font-size:12px;color:#262626;outline:none;transition:border .15s;}
.sp-input:focus{border-color:#FE6100;}
.sp-input::placeholder{color:#BDBDBD;}
.sp-input-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;color:#BDBDBD;font-size:14px;display:none;line-height:1;}
.sp-input-clear.vis{display:block;}

/* Buscar button */
.sp-btn{width:100%;height:36px;background:#FE6100;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
.sp-btn:hover{background:#E05500;}
.sp-btn:active{background:#CC4D00;}

/* Results section */
.sp-results{flex:1;overflow-y:auto;padding:12px 0 0;}
.sp-results::-webkit-scrollbar{width:3px;}
.sp-results::-webkit-scrollbar-thumb{background:#E0E0E0;border-radius:2px;}
.sp-results-label{font-size:10px;color:#9E9E9E;padding:0 16px 6px;font-weight:500;}
.sp-empty{padding:24px 16px;text-align:center;color:#BDBDBD;font-size:12px;line-height:1.6;}

/* Result card */
.r-card{margin:0 10px 6px;padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:#F9F9F9;transition:all .15s;}
.r-card:hover{background:#FFF7F3;border-color:#FFD5B8;}
.r-card.active{background:#FFF3EC;border-color:#FE6100;}
.r-card.active .r-card-name{color:#FE6100;}
.r-card-name{font-size:13px;font-weight:600;color:#262626;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r-card-id{font-size:11px;color:#9E9E9E;margin-bottom:1px;}
.r-card-sub{font-size:11px;color:#9E9E9E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r-card-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:500;padding:2px 7px;border-radius:999px;margin-top:4px;}
.badge-green{background:#ECFDF5;color:#059669;}
.badge-red{background:#FEF2F2;color:#DC2626;}
.badge-blue{background:#EFF6FF;color:#2563EB;}
.badge-gray{background:#F5F5F5;color:#9E9E9E;}
.badge-orange{background:#FFF3EC;color:#FE6100;}

/* ── Detail panel ── */
.detail{flex:1;overflow-y:auto;background:#F5F5F5;padding:20px 20px 20px;}
.detail::-webkit-scrollbar{width:4px;}
.detail::-webkit-scrollbar-thumb{background:#E0E0E0;border-radius:2px;}

/* No selection */
.no-sel{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#BDBDBD;}
.no-sel svg{width:40px;height:40px;opacity:.3;}
.no-sel p{font-size:13px;}

/* Detail card */
.d-card{background:#fff;border-radius:10px;border:1px solid #EBEBEB;margin-bottom:14px;overflow:hidden;}
.d-head{padding:14px 20px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #F5F5F5;}
.d-av{width:40px;height:40px;border-radius:8px;background:#FFF3EC;color:#FE6100;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.d-av.av-blue{background:#EEF2FF;color:#4F46E5;}
.d-av.av-green{background:#ECFDF5;color:#059669;}
.d-av.av-orange{background:#FFF7ED;color:#EA580C;}
.d-av.av-sky{background:#F0F9FF;color:#0284C7;}
.d-info{flex:1;}
.d-name{font-size:16px;font-weight:700;color:#262626;line-height:1.2;}
.d-meta{font-size:12px;color:#9E9E9E;margin-top:3px;}
.d-chips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.chip{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;}
.chip-orange{background:#FFF3EC;color:#FE6100;}
.chip-blue{background:#EFF6FF;color:#2563EB;}
.chip-green{background:#ECFDF5;color:#059669;}
.chip-gray{background:#F5F5F5;color:#757575;}
.chip-red{background:#FEF2F2;color:#DC2626;}
.d-acts{margin-left:auto;display:flex;gap:6px;flex-shrink:0;}
.btn{height:30px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #E0E0E0;background:#fff;color:#757575;transition:all .15s;}
.btn:hover{border-color:#FE6100;color:#FE6100;}
.btn-primary{background:#FE6100;color:#fff;border-color:#FE6100;}
.btn-primary:hover{background:#E05500;border-color:#E05500;color:#fff;}

/* KPI row */
.kpi-row{display:flex;border-bottom:1px solid #F5F5F5;}
.kpi{flex:1;padding:12px 20px;border-right:1px solid #F5F5F5;}
.kpi:last-child{border-right:none;}
.kpi-label{font-size:11px;color:#9E9E9E;margin-bottom:4px;}
.kpi-val{font-size:15px;font-weight:700;color:#262626;}
.kpi-val.red{color:#DC2626;}
.kpi-val.green{color:#059669;}
.kpi-val.orange{color:#FE6100;}

/* Tabs */
.d-tabs{display:flex;padding:0 20px;border-bottom:1px solid #F5F5F5;}
.d-tab{padding:11px 14px;font-size:13px;font-weight:500;color:#9E9E9E;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.d-tab:hover{color:#262626;}
.d-tab.on{color:#FE6100;border-bottom-color:#FE6100;}
.d-body{padding:18px 20px;}

/* Fields */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fi{display:flex;flex-direction:column;gap:3px;}
.fl{font-size:11px;color:#9E9E9E;font-weight:500;}
.fv{font-size:13px;color:#262626;font-weight:500;}
.fv.muted{color:#9E9E9E;}

/* ── Status badges — espelho exato do Admin ── */
/* Contratos */
.st-paid{background:#ECFDF5;color:#059669;}           /* paid → verde */
.st-created{background:#EFF6FF;color:#2563EB;}        /* created → azul */
.st-waiting{background:#FFF7ED;color:#EA580C;}        /* waiting_payment / pending_payment → laranja */
.st-trialing{background:#F5F3FF;color:#7C3AED;}       /* trialing → roxo */
.st-unpaid{background:#FEF2F2;color:#DC2626;}         /* unpaid → vermelho */
.st-failed{background:#FEF2F2;color:#DC2626;}         /* failed → vermelho */
.st-refused{background:#FEF2F2;color:#DC2626;}        /* refused → vermelho */
.st-canceled{background:#F5F5F5;color:#9E9E9E;}       /* canceled → cinza */
.st-ended{background:#F5F5F5;color:#9E9E9E;}          /* ended → cinza */
.st-refunded{background:#EFF6FF;color:#0284C7;}       /* refunded → azul claro */
.st-chargedback{background:#FFF1F2;color:#9F1239;}    /* chargedback → vermelho escuro */
/* Vendas */
.st-processing{background:#FFF7ED;color:#EA580C;}     /* processing → laranja */
.st-completed{background:#ECFDF5;color:#059669;}      /* completed → verde */
.st-refund_pending{background:#FEFCE8;color:#CA8A04;} /* refund_pending → amarelo */
.st-future{background:#F5F3FF;color:#7C3AED;}         /* future → roxo */
.ca-header{padding:10px 20px 14px;border-bottom:1px solid #F0F0F0;}
.ca-query{font-size:11px;color:#9E9E9E;margin-bottom:2px;}
.ca-query-val{font-size:14px;font-weight:700;color:#FE6100;}
.ca-list{display:flex;flex-direction:column;gap:0;}
.ca-row{border-bottom:1px solid #F0F0F0;cursor:pointer;transition:background .12s;}
.ca-row:last-child{border-bottom:none;}
.ca-row:hover{background:#FFFBF9;}
.ca-row.open{background:#FFFBF9;}
.ca-row-top{padding:14px 20px;display:flex;align-items:flex-start;gap:16px;}
.ca-row-id{min-width:160px;flex-shrink:0;}
.ca-row-id-label{font-size:14px;font-weight:700;color:#262626;}
.ca-row-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:4px;}
.ca-row-badge.pago{background:#ECFDF5;color:#059669;}
.ca-row-badge.nao-pago{background:#FFF3EC;color:#FE6100;}
.ca-row-badge.recusado{background:#FEF2F2;color:#DC2626;}
.ca-row-badge.ativo{background:#ECFDF5;color:#059669;}
.ca-row-badge.encerrado{background:#F5F5F5;color:#9E9E9E;}
.ca-row-badge.pendente{background:#EFF6FF;color:#2563EB;}
.ca-row-cols{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;flex:1;}
.ca-col-label{font-size:10px;color:#9E9E9E;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.ca-col-val{font-size:13px;font-weight:600;color:#262626;}
.ca-row-arrow{margin-left:auto;color:#BDBDBD;font-size:16px;padding-left:12px;transition:transform .2s;flex-shrink:0;align-self:center;}
.ca-row.open .ca-row-arrow{transform:rotate(180deg);}
.ca-expand{display:none;padding:0 20px 16px;border-top:1px solid #F8F8F8;}
.ca-row.open .ca-expand{display:block;}
.ca-expand-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;background:#FAFAFA;border-radius:8px;padding:14px 16px;}
.ca-expand-fi{display:flex;flex-direction:column;gap:2px;}
.ca-expand-label{font-size:10px;color:#9E9E9E;font-weight:500;}
.ca-expand-val{font-size:12px;font-weight:500;color:#262626;}
.ca-expand-actions{display:flex;gap:8px;margin-top:12px;}
.ca-expand-btn{height:32px;padding:0 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.ca-expand-btn-primary{background:#FE6100;color:#fff;border:none;}
.ca-expand-btn-primary:hover{background:#E05500;}
.ca-expand-btn-sec{background:#fff;color:#DC2626;border:1.5px solid #DC2626;}
.ca-expand-btn-sec:hover{background:#FEF2F2;}
.ca-expand-btn-ghost{background:#fff;color:#757575;border:1px solid #E0E0E0;}
.ca-expand-btn-ghost:hover{border-color:#FE6100;color:#FE6100;}
.ca-tx-mini{margin-top:10px;}
.ca-tx-mini-title{font-size:11px;font-weight:600;color:#9E9E9E;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.ca-tx-mini table{width:100%;border-collapse:collapse;}
.ca-tx-mini th{font-size:10px;color:#9E9E9E;text-align:left;padding:4px 8px;border-bottom:1px solid #F0F0F0;}
.ca-tx-mini td{font-size:12px;padding:5px 8px;border-bottom:1px solid #F8F8F8;color:#262626;}
.ca-tx-mini td:last-child{border-bottom:none;}
.ca-tx-link{color:#2563EB;cursor:pointer;font-weight:500;}
.ca-tx-link:hover{text-decoration:underline;}
.ca-wrap{background:#fff;border-radius:10px;border:1px solid #EBEBEB;overflow:hidden;}
</style>
</head>

<!-- Search panel -->
<div class="search-panel">

    <select class="sp-select" id="entitySelect" onchange="onEntityChange()">

      <option value="venda">Venda</option>
      <option value="contrato">Contrato</option>
      <option value="produto">Produto</option>

    <select class="sp-subfilter" id="subfilterSelect"></select>

    <!-- Input -->
    <div class="sp-input-wrap">
      <input class="sp-input" id="searchInput" type="text" placeholder="Digite para buscar..." onkeydown="if(event.key==='Enter')doSearch()" oninput="toggleClear(this)">

<!-- Detail -->

let currentEntity = 'cliente';
let selectedId = null;

function onEntityChange() {
  currentEntity = document.getElementById('entitySelect').value;
  document.getElementById('spTitle').textContent = ENTITIES[currentEntity].label;
  updateSubfilter();
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('vis');
  document.getElementById('resultsList').innerHTML = '<div class="sp-empty">Selecione o tipo e<br>realize uma busca</div>';
  selectedId = null;
  document.getElementById('detail').innerHTML = `<div class="no-sel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>Selecione um resultado para ver os detalhes</p></div>`;
}

function updateSubfilter() {
  const filters = ENTITIES[currentEntity].filters;
  const sel = document.getElementById('subfilterSelect');
  sel.innerHTML = filters.map(f => `<option>${f}</option>`).join('');
}

function toggleClear(input) {
  document.getElementById('clearBtn').classList.toggle('vis', input.value.length > 0);
}

function clearInput() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('vis');
  document.getElementById('searchInput').focus();
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const subfilter = document.getElementById('subfilterSelect').value;
  const items = MOCK[currentEntity] || [];

  let filtered;
  if (currentEntity === 'contrato') {
    if (!q) { filtered = items; }
    else if (subfilter === 'ID do Contrato') {
      filtered = items.filter(i => i.id.toLowerCase() === q || i.id.toLowerCase().includes(q));
    } else if (subfilter === 'E-mail do Comprador') {
      filtered = items.filter(i => i.cliente_email && i.cliente_email.toLowerCase().includes(q));
    } else if (subfilter === 'Nome do Comprador') {
      filtered = items.filter(i => i.cliente_nome && i.cliente_nome.toLowerCase().includes(q));
    } else {
      // CPF/CNPJ do Comprador
      const qClean = q.replace(/\D/g,'');
      filtered = items.filter(i => {
        const docClean = (i.cliente_doc||'').replace(/\D/g,'');
        return docClean.includes(qClean);
      });
    }
  } else {
    filtered = q ? items.filter(i => {
      const sf = subfilter;
      if (sf === 'ID') return i.id.toLowerCase().includes(q);
      if (sf === 'Nome') return i.title.toLowerCase().includes(q);
      if (sf === 'E-mail') return i.sub.toLowerCase().includes(q);
      if (sf === 'CPF/CNPJ') {
        const qc = q.replace(/\D/g,'');
        return (i.sub2||'').replace(/\D/g,'').includes(qc) || i.sub.toLowerCase().includes(q);
      }
      if (sf === 'Telefone') return (i.sub||'').replace(/\D/g,'').includes(q.replace(/\D/g,''));
      // fallback
      return `${i.id} ${i.title} ${i.sub} ${i.sub2||''}`.toLowerCase().includes(q);
    }) : items;
  }

  const list = document.getElementById('resultsList');

  if (filtered.length === 0) {
    list.innerHTML = `<div class="sp-empty">Nenhum resultado</div>`;
    document.getElementById('detail').innerHTML = `<div class="no-sel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>Nenhum resultado encontrado</p></div>`;
    return;
  }

  if (currentEntity === 'contrato') {
    list.innerHTML = `<div class="sp-results-label">Resultados (${filtered.length})</div>` +
      filtered.map(item => {
        const st = item.status === 'Ativo' ? 'badge-green' : item.status === 'Encerrado' ? 'badge-gray' : 'badge-red';
        return `<div class="r-card${item.id===selectedId?' active':''}" onclick="selectItem('${item.id}')">
          <div class="r-card-name">#${item.id}</div>
          <div class="r-card-id">${item.cliente_nome}</div>
          <div class="r-card-sub">${item.cliente_email}</div>
          <span class="r-card-badge ${st}">${item.status}</span>
        </div>`;
      }).join('');
    renderContratoTable(filtered, q, subfilter);
    selectedId = filtered[0].id;
  } else {
    list.innerHTML = `<div class="sp-results-label">Resultados (${filtered.length})</div>` +
      filtered.map(item => {
        const badgeClass = STATUS_BADGE[item.status] || 'badge-gray';
        const isActive = item.id === selectedId;
        return `<div class="r-card${isActive?' active':''}" onclick="selectItem('${item.id}')">
          <div class="r-card-name">${item.title}</div>
          <div class="r-card-id">${item.sub2}</div>
          <div class="r-card-sub">${item.sub}</div>
          <span class="r-card-badge ${badgeClass}">${item.status}</span>
        </div>`;
      }).join('');
    if (!selectedId || !filtered.find(i=>i.id===selectedId)) selectItem(filtered[0].id);
  }
}

function selectItem(id) {
  selectedId = id;
  const items = MOCK[currentEntity] || [];
  const item = items.find(i=>i.id===id);
  if (!item) return;

  // Re-render cards to update active state
  const cards = document.querySelectorAll('.r-card');
  cards.forEach(c => {
    const onclick = c.getAttribute('onclick');
    c.classList.toggle('active', onclick && onclick.includes(`'${id}'`));
    if (c.classList.contains('active')) c.querySelector('.r-card-name').style.color = '#FE6100';
    else c.querySelector('.r-card-name').style.color = '';
  });

  renderDetail(item);
}

function renderDetail(item) {
  const cfg = ENTITIES[currentEntity];
  const initials = cfg.avLabel(item);

  const kpiHtml = `<div class="kpi-row">${item.kpis.map(k=>`<div class="kpi"><div class="kpi-label">${k.l}</div><div class="kpi-val">${k.v}</div></div>`).join('')}</div>`;
  const tabsHtml = `<div class="d-tabs">${item.tabs.map((t,i)=>`<div class="d-tab${i===0?' on':''}" onclick="switchTab(this)">${t}</div>`).join('')}</div>`;
  const fieldsHtml = `<div class="fg">${item.fields.map(f=>`<div class="fi"><div class="fl">${f.l}</div><div class="fv">${f.v}</div></div>`).join('')}</div>`;
  const chips = item.tags.map(t=>`<span class="chip ${STATUS_CHIP[t]||'chip-gray'}">${t}</span>`).join('');

  document.getElementById('detail').innerHTML = `
    <div class="d-card">
      <div class="d-head">
        <div class="d-av ${cfg.avClass}">${initials}</div>
        <div class="d-info">
          <div class="d-name">${item.title}</div>
          <div class="d-meta">ID ${item.id} · ${cfg.label.slice(0,-1)} · Criação 08/07/2026</div>
          <div class="d-chips">${chips}<span class="chip ${STATUS_CHIP[item.status]||'chip-gray'}">${item.status}</span></div>
        </div>
        <div class="d-acts">
          <button class="btn">Editar ✏</button>
          <button class="btn btn-primary">↗ Abrir</button>
        </div>
      </div>
      ${kpiHtml}
      ${tabsHtml}
      <div class="d-body">${fieldsHtml}</div>
    </div>`;
}

function switchTab(el) {
  document.querySelectorAll('.d-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
}

      <!-- Linha do contrato -->
      <tr class="ca-trow" id="ctr-${ci}" onclick="toggleTRow(${ci})" style="cursor:pointer;border-bottom:1px solid #F0F0F0;transition:background .12s;">
        <td style="padding:12px 14px;white-space:nowrap;">
          <span class="ca-row-badge ${STATUS_CONTRATO_CLASS[c.status]||'st-created'}">${STATUS_CONTRATO_LABEL[c.status]||c.status}</span>
        </td>
        <td style="padding:12px 14px;font-weight:700;font-size:13px;color:#262626;white-space:nowrap;">${c.id}</td>
        <td style="padding:12px 14px;font-size:13px;font-weight:600;color:#262626;">${c.cliente_nome}</td>
        <td style="padding:12px 14px;font-size:12px;color:#9E9E9E;">${c.cliente_email}</td>
        <td style="padding:12px 14px;font-size:13px;color:#262626;">${c.cliente_doc}</td>
        <td style="padding:12px 14px;">
          <div style="font-size:13px;font-weight:500;color:#FE6100;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;" onclick="event.stopPropagation();alert('Produto #${c.produto_id}: ${c.produto_nome}')">${c.produto_nome} ↗</div>
        </td>
        <td style="padding:12px 14px;font-size:13px;color:#262626;text-align:center;">${c.parcela}</td>
        <td style="padding:12px 14px;font-size:13px;color:#262626;">${c.data_assinatura}</td>
        <td style="padding:12px 14px;text-align:center;color:#BDBDBD;font-size:16px;" id="ctr-arr-${ci}">⌄</td>
      </tr>
      <!-- Sub-linha de transações (oculta por padrão) -->
      <tr id="ctr-exp-${ci}" style="display:none;background:#FAFAFA;">
        <td colspan="9" style="padding:0;">
          <!-- Seção intermediária: Produto + Dados da assinatura -->
          <div style="padding:16px 20px;display:flex;gap:32px;border-top:1px solid #F0F0F0;background:#FAFAFA;">
            <!-- Produto -->
            <div style="display:flex;align-items:flex-start;gap:12px;min-width:200px;">
              <div style="width:40px;height:40px;border-radius:10px;background:#F5F5F5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9E9E" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              </div>
              <div>
                <div style="font-size:11px;color:#9E9E9E;">Produto: #${c.produto_id}</div>
                <div style="font-size:14px;font-weight:700;color:#262626;margin:2px 0;">${c.produto_nome}</div>
                <div style="font-size:11px;color:#9E9E9E;">Código da Oferta: ${c.oferta_cod}</div>
              </div>
            </div>
            <!-- Divisor -->
            <div style="width:1px;background:#EBEBEB;flex-shrink:0;"></div>
            <!-- Dados da assinatura -->
            <div style="flex:1;">
              <div style="font-size:12px;font-weight:700;color:#262626;margin-bottom:10px;">Dados da assinatura</div>
              <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px 20px;">
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">ID</div><div style="font-size:12px;font-weight:600;color:#262626;">${c.id}</div></div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Status</div>
                  <span class="ca-row-badge ${STATUS_CONTRATO_CLASS[c.status]||'st-created'}" style="display:inline-flex;margin-top:2px;">${STATUS_CONTRATO_LABEL[c.status]||c.status}</span>
                </div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Data da assinatura</div><div style="font-size:12px;font-weight:600;color:#262626;">${c.data_assinatura}</div></div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Data de vencimento</div><div style="font-size:12px;font-weight:600;color:#262626;">${c.prox_vencimento}</div></div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Método de pagamento</div><div style="font-size:12px;font-weight:600;color:#262626;">${c.metodo}</div></div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Parcela da Assinatura</div><div style="font-size:12px;font-weight:600;color:#262626;">${c.parcela}</div></div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Valor Bruto</div><div style="font-size:12px;font-weight:600;color:#262626;">${c.valor_bruto}</div></div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Adesão</div><div style="font-size:12px;font-weight:600;color:#262626;">${c.adesao}</div></div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Data de cancelamento</div><div style="font-size:12px;font-weight:600;color:${c.data_cancelamento ? '#DC2626' : '#BDBDBD'};">${c.data_cancelamento || '—'}</div></div>
                <div><div style="font-size:10px;color:#9E9E9E;font-weight:500;margin-bottom:2px;">Data de encerramento</div><div style="font-size:12px;font-weight:600;color:${c.data_encerramento ? '#262626' : '#BDBDBD'};">${c.data_encerramento || '—'}</div></div>
              </div>
            </div>
          </div>
          <!-- Tabela de transações -->
          <div>
            <table style="width:100%;border-collapse:collapse;border-top:1px solid #F0F0F0;">
              <thead>
                <tr style="background:#F5F5F5;">
                  <th style="font-size:10px;color:#BDBDBD;font-weight:600;text-align:left;padding:7px 12px;letter-spacing:.4px;">STATUS</th>
                  <th style="font-size:10px;color:#BDBDBD;font-weight:600;text-align:left;padding:7px 12px;letter-spacing:.4px;">ID DA VENDA</th>
                  <th style="font-size:10px;color:#BDBDBD;font-weight:600;text-align:left;padding:7px 12px;letter-spacing:.4px;">MÉTODO</th>
                  <th style="font-size:10px;color:#BDBDBD;font-weight:600;text-align:left;padding:7px 12px;letter-spacing:.4px;">CRIAÇÃO</th>
                  <th style="font-size:10px;color:#BDBDBD;font-weight:600;text-align:center;padding:7px 12px;letter-spacing:.4px;">VENCIMENTO</th>
                  <th style="font-size:10px;color:#BDBDBD;font-weight:600;text-align:center;padding:7px 12px;letter-spacing:.4px;">PAGAMENTO</th>
                  <th style="font-size:10px;color:#BDBDBD;font-weight:600;text-align:right;padding:7px 12px;letter-spacing:.4px;">VALOR</th>
                </tr>
              </thead>
              <tbody>${txRows}</tbody>
            </table>
          </div>
          <div style="padding:10px 14px;display:flex;gap:8px;border-top:1px solid #F0F0F0;">
              <button class="ca-expand-btn ca-expand-btn-sec">Encerrar Contrato</button>
            </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('detail').innerHTML = `
    <div class="ca-wrap">
      <div class="ca-header">
        <div class="ca-query">Resultados para:</div>
        <div class="ca-query-val">${subfilter}: ${q || 'todos'}</div>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;min-width:900px;">
          <thead>
            <tr style="background:#FAFAFA;border-bottom:2px solid #F0F0F0;">
              <th style="font-size:11px;color:#9E9E9E;font-weight:600;text-align:left;padding:10px 14px;letter-spacing:.4px;">STATUS</th>
              <th style="font-size:11px;color:#9E9E9E;font-weight:600;text-align:left;padding:10px 14px;letter-spacing:.4px;">ID CONTRATO</th>
              <th style="font-size:11px;color:#9E9E9E;font-weight:600;text-align:left;padding:10px 14px;letter-spacing:.4px;">NOME</th>
              <th style="font-size:11px;color:#9E9E9E;font-weight:600;text-align:left;padding:10px 14px;letter-spacing:.4px;">E-MAIL</th>
              <th style="font-size:11px;color:#9E9E9E;font-weight:600;text-align:left;padding:10px 14px;letter-spacing:.4px;">CPF/CNPJ</th>
              <th style="font-size:11px;color:#9E9E9E;font-weight:600;text-align:left;padding:10px 14px;letter-spacing:.4px;">PRODUTO</th>
              <th style="font-size:11px;color:#9E9E9E;font-weight:600;text-align:center;padding:10px 14px;letter-spacing:.4px;">PARCELAS</th>
              <th style="font-size:11px;color:#9E9E9E;font-weight:600;text-align:left;padding:10px 14px;letter-spacing:.4px;">CRIAÇÃO</th>
              <th style="width:32px;"></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function toggleTRow(ci) {
  const exp = document.getElementById(`ctr-exp-${ci}`);
  const arr = document.getElementById(`ctr-arr-${ci}`);
  const row = document.getElementById(`ctr-${ci}`);
  const isOpen = exp.style.display !== 'none';
  exp.style.display = isOpen ? 'none' : 'table-row';
  arr.style.transform = isOpen ? '' : 'rotate(180deg)';
  arr.style.transition = 'transform .2s';
  row.style.background = isOpen ? '' : '#FFFBF9';
}

// Init — sem pré-carregamento
updateSubfilter();
</script>
</body>
</html>
