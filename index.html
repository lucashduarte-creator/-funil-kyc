<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYC — Acesso</title>
<style>
:root{--primary-60:#FE6100;--primary-50:#CB4E00;--neutral-15:#262626;--neutral-40:#878787;--neutral-50:#909092;--neutral-90:#E2E2E2;--neutral-95:#ECECEC;--neutral-99:#F9F9F9;--danger-40:#A42B23;--surface:#FFFFFF;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--neutral-99);color:var(--neutral-15);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:var(--surface);border:1px solid var(--neutral-90);border-radius:16px;padding:40px;width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:20px;color:var(--primary-60);margin-bottom:32px;}
.logo svg{width:32px;height:32px;}
.title{font-size:18px;font-weight:700;text-align:center;margin-bottom:4px;}
.sub{font-size:13px;color:var(--neutral-40);text-align:center;margin-bottom:28px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--neutral-40);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;}
.field input{width:100%;padding:10px 14px;border:1.5px solid var(--neutral-90);border-radius:8px;font-size:14px;color:var(--neutral-15);background:var(--surface);outline:none;transition:border-color 0.15s;}
.field input:focus{border-color:var(--primary-60);}
.field input::placeholder{color:var(--neutral-50);}
.error{display:none;background:#FDF7F6;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger-40);margin-bottom:16px;}
.error.show{display:block;}
.btn{width:100%;padding:11px;background:var(--primary-60);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s;margin-top:4px;}
.btn:hover{background:var(--primary-50);}
.footer{text-align:center;margin-top:20px;font-size:12px;color:var(--neutral-40);}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 40 40" fill="none"><path d="M8 12L20 28L32 12" stroke="#FE6100" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    voomp
  </div>
  <h1 class="title">Acesso restrito</h1>
  <p class="sub">KYC Prioritário — área interna</p>
  <div class="error" id="err">Usuário ou senha incorretos.</div>
  <div class="field">
    <label>Usuário</label>
    <input type="text" id="u" placeholder="Digite seu usuário" autocomplete="username" />
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="p" placeholder="Digite sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" />
  </div>
  <button class="btn" onclick="login()">Entrar</button>
  <p class="footer">Equipe Voomp</p>
</div>
<script>
const USERS = { 'Voomp2026': 'Kyc@2026##' };

if (sessionStorage.getItem('kyc_auth') === '1') {
  window.location.replace('funil-kyc/');
}

function login() {
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  if (USERS[u] && USERS[u] === p) {
    sessionStorage.setItem('kyc_auth', '1');
    window.location.replace('funil-kyc/');
  } else {
    document.getElementById('err').classList.add('show');
    document.getElementById('p').value = '';
    document.getElementById('p').focus();
  }
}
</script>
</body>
</html>
